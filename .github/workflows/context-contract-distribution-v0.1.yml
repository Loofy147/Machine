name: Context Contract Distribution Center v0.1

on:
  push:
    branches:
      - experiment/context-contract-distribution-center-v0.1
    paths:
      - experiments/context-contract-distribution-v0/**
      - docs/research/CONTEXT-CONTRACT-DISTRIBUTION-CENTER-v0.1.md
      - .github/workflows/context-contract-distribution-v0.1.yml
  pull_request:
    branches:
      - main
      - integration/predecessor-frontier-contract-v0.1
    paths:
      - experiments/context-contract-distribution-v0/**
      - docs/research/CONTEXT-CONTRACT-DISTRIBUTION-CENTER-v0.1.md
      - .github/workflows/context-contract-distribution-v0.1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install planner dependency
        working-directory: experiments/context-contract-distribution-v0
        run: python -m pip install -r requirements.txt
      - name: Compile planner, actual-data loader, and runners
        run: |
          python -m py_compile \
            experiments/context-contract-distribution-v0/context_contract_distribution.py \
            experiments/context-contract-distribution-v0/run_demo.py \
            experiments/context-contract-distribution-v0/test_context_contract_distribution.py \
            experiments/context-contract-distribution-v0/stress_test_real_datasets.py \
            experiments/context-contract-distribution-v0/stress_test_multiwoz.py \
            experiments/context-contract-distribution-v0/test_multiwoz_context_benchmark.py
      - name: Run contract and context-conversion tests
        working-directory: experiments/context-contract-distribution-v0
        run: python -m unittest -v
      - name: Execute demo and validate emitted plan invariants
        working-directory: experiments/context-contract-distribution-v0
        run: |
          python run_demo.py > DEMO-PLAN-RESULTS.json
          python - <<'PY'
          import json
          with open("DEMO-PLAN-RESULTS.json", encoding="utf-8") as handle:
              result = json.load(handle)
          for key in ("initial_plan", "anchor_update"):
              assert key in result, key
          for plan in (result["initial_plan"], result["anchor_update"]["plan"]):
              selected = set(plan["selected_contexts"])
              assert len(selected) == 2 * len(plan["pairs"])
              assert len(selected) == len(plan["selected_contexts"])
              excluded = {row["context_id"] for row in plan["anchor_exclusions"]}
              assert selected.isdisjoint(excluded)
              assert plan["input_digest_sha256"]
          PY
      - name: Install supplementary synthetic-control dependencies
        working-directory: experiments/context-contract-distribution-v0
        run: python -m pip install -r requirements-benchmark.txt
      - name: Run supplementary synthetic-control stress suites
        working-directory: experiments/context-contract-distribution-v0
        env:
          PYTHONHASHSEED: "0"
        run: python stress_test_real_datasets.py
      - name: Run actual MultiWOZ 2.2 dialogue-corpus benchmark
        working-directory: experiments/context-contract-distribution-v0
        env:
          PYTHONHASHSEED: "0"
        run: python stress_test_multiwoz.py --output MULTIWOZ-REAL-DATA-RESULTS.json
      - name: Upload planner and dataset-derived evidence
        uses: actions/upload-artifact@v4
        with:
          name: context-contract-distribution-v0.1
          if-no-files-found: error
          path: |
            experiments/context-contract-distribution-v0/DEMO-PLAN-RESULTS.json
            experiments/context-contract-distribution-v0/REAL-DATASET-STRESS-RESULTS.json
            experiments/context-contract-distribution-v0/MULTIWOZ-REAL-DATA-RESULTS.json
