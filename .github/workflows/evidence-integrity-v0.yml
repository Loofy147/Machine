name: evidence-integrity-v0

on:
  push:
    branches:
      - research/evidence-disposition-v0
  workflow_dispatch:

jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify evidence manifest and recorded result
        run: python3 tools/verify_evidence.py
