name: HSDCR capability substitution boundary

on:
  push:
    paths:
      - "experiments/hsdcr-capability-substitution-v0/**"
      - ".github/workflows/hsdcr-capability-substitution-v0.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run boundary substitution test
        run: python3 experiments/hsdcr-capability-substitution-v0/run.py
