name: hsdcr-composition-reduction-v0

on:
  push:
    paths:
      - 'experiments/hsdcr-composition-reduction-v0/**'
      - 'docs/research/HSDCR-MINIMAL-SEMANTIC-BOUNDARY-v0.1.yaml'
      - 'docs/research/HSDCR-REASSESSMENT-v0.1.md'
  pull_request:
    paths:
      - 'experiments/hsdcr-composition-reduction-v0/**'
      - 'docs/research/HSDCR-MINIMAL-SEMANTIC-BOUNDARY-v0.1.yaml'
      - 'docs/research/HSDCR-REASSESSMENT-v0.1.md'

jobs:
  reduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run reduction harness
        run: python experiments/hsdcr-composition-reduction-v0/run.py > /tmp/result.json
      - name: Compare canonical result
        run: diff -u experiments/hsdcr-composition-reduction-v0/RESULTS-V0.1.json /tmp/result.json
