name: hsdcr-e2e-composition-v0

on:
  push:
    paths:
      - 'experiments/hsdcr-e2e-composition-v0/**'
  pull_request:
    paths:
      - 'experiments/hsdcr-e2e-composition-v0/**'

jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run composition oracle
        run: python experiments/hsdcr-e2e-composition-v0/run.py > /tmp/result.json
      - name: Compare recorded evidence
        run: diff -u experiments/hsdcr-e2e-composition-v0/RESULTS-V0.1.json /tmp/result.json
