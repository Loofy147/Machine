name: HSDCR real capability substitution

on:
  push:
    paths:
      - "experiments/hsdcr-real-capability-substitution-v0/**"
      - ".github/workflows/hsdcr-real-capability-substitution-v0.yml"
  pull_request:
    paths:
      - "experiments/hsdcr-real-capability-substitution-v0/**"
      - ".github/workflows/hsdcr-real-capability-substitution-v0.yml"
    paths:
      - "experiments/hsdcr-real-capability-substitution-v0/**"
      - ".github/workflows/hsdcr-real-capability-substitution-v0.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real capability substitution test
        run: python3 experiments/hsdcr-real-capability-substitution-v0/run.py
