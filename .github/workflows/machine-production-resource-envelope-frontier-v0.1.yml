name: Machine Production Resource Envelope Frontier v0.1

on:
  push:
    branches:
      - research/machine-substrate-primitive-closure-v0
  pull_request:
    branches:
      - research/bidirectional-substrate-v3

jobs:
  resource-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run resource frontier
        run: python experiments/machine-production-resource-envelope-v0/run_frontier.py > experiments/machine-production-resource-envelope-v0/RESULTS-V0.1.json
      - name: Validate JSON
        run: python -c "import json; json.load(open('experiments/machine-production-resource-envelope-v0/RESULTS-V0.1.json'))"
      - uses: actions/upload-artifact@v4
        with:
          name: machine-production-resource-envelope-frontier-v0.1
          path: experiments/machine-production-resource-envelope-v0/RESULTS-V0.1.json
