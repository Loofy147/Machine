name: Machine Substrate Resource Contract v0.1

on:
  push:
    branches:
      - research/machine-substrate-primitive-closure-v0
  pull_request:
    branches:
      - research/bidirectional-substrate-v3

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen resource schema
        working-directory: experiments/machine-substrate-resource-contract-v0
        run: python validate_contract.py
      - name: Upload validation
        uses: actions/upload-artifact@v4
        with:
          name: machine-substrate-resource-contract-v0.1
          path: experiments/machine-substrate-resource-contract-v0/VALIDATION-V0.1.json
