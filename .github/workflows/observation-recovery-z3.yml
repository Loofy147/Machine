name: observation-recovery-z3

on:
  push:
    branches:
      - research/observation-dynamics-factorization-v0.1
  pull_request:
    branches:
      - main

jobs:
  z3-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Z3
        run: python -m pip install --disable-pip-version-check z3-solver
      - name: Check 32-bit recovery boundary
        run: python experiments/splitmix_recovery_z3.py --bits 32 --lengths 2 3 --timeout-ms 20000
      - name: Check 16-bit recovery boundary
        run: python experiments/splitmix_recovery_z3.py --bits 16 --lengths 7 8 --timeout-ms 20000
