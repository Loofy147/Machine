name: observation-recovery-z3

on:
  push:
    branches:
      - research/observation-dynamics-factorization-v0.1
  pull_request:
    branches:
      - main

concurrency:
  group: observation-recovery-z3
  cancel-in-progress: true

jobs:
  z3-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Z3
        run: python -m pip install --disable-pip-version-check z3-solver
      - name: 32-bit candidate boundary
        run: python experiments/splitmix_recovery_z3.py --bits 32 --lengths 2 3 4 --timeout-ms 30000 --fail-on-unknown
      - name: 16-bit candidate boundary
        run: python experiments/splitmix_recovery_z3.py --bits 16 --lengths 7 8 --timeout-ms 30000 --fail-on-unknown
