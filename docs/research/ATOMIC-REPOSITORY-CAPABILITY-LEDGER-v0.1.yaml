    question: "Which family, if any, provides the minimal canonical-state rule?"
  - id: Q003
    question: "Can observation/evidence/authority remain independent while sharing one durable history?"
  - id: Q004
    question: "Can high sensitivity coexist with explicit non-reactivity as a native invariant rather than as application policy?"
