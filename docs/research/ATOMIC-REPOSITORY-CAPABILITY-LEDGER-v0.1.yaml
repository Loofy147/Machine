    rule: "identity != mutable location"
  - id: R02
    rule: "contribution != canonical state"
  - id: R03
    rule: "signal != evidence"
  - id: R04
    rule: "evidence != authority"
  - id: R05
    rule: "observation != mutation authority"
  - id: R06
    rule: "derived state != new information"
  - id: R07
    rule: "reconstruction != synchronization"
  - id: R08
    rule: "convergence != acceptance"
  - id: R09
    rule: "sensitivity != reactivity"
  - id: R10
    rule: "semantic equivalence != resource equivalence"

