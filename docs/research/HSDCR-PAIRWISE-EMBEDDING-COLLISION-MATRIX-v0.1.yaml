schema: hsdcr-embedding-collision-matrix/v0.1
status: research
normative: false
classification_rule:
  N: native_coverage
  C: composable_without_changing_family_identity
  X: extension_required
  K: collision_or_semantic_collapse_risk
  U: unresolved
  E: external_component_only
notes:
  - "This matrix is an analytical crosswalk, not a claim made by the referenced projects."
  - "A cell marked C means the capability can be composed from the family but is not a defining primitive of that family."
  - "A cell marked X means preserving the candidate distinction requires a semantic extension."
  - "K marks cases where absorbing the candidate concept into the family risks collapsing a distinction that the candidate investigation requires."
  - "No novelty or superiority conclusion follows from matrix coverage."

