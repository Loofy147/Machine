pairwise_test_rule:
  full_absorption: "Every required atom maps to N or C and every collision invariant remains expressible without a semantic extension."
  partial_embedding: "Some atoms map to N/C but at least one required distinction maps to X or K."
  non_embedding: "The family cannot preserve multiple required atoms without changing its defining semantics."
  unresolved: "Available documentation is insufficient to decide the mapping."

