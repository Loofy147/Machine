name: hsdcr-e2e-composition-v0.2

on:
  push:
    paths:
      - 'experiments/hsdcr-e2e-composition-v0.2/**'
      - '.github/workflows/hsdcr-e2e-composition-v0.2.yml'
  pull_request:
    paths:
      - 'experiments/hsdcr-e2e-composition-v0.2/**'
      - '.github/workflows/hsdcr-e2e-composition-v0.2.yml'

jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hardened composition oracle
        run: python experiments/hsdcr-e2e-composition-v0.2/run.py > /tmp/result.json

      - name: Compare recorded evidence
        run: diff -u experiments/hsdcr-e2e-composition-v0.2/RESULTS-V0.1.json /tmp/result.json
